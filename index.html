<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : l'app occupe tout l'écran de l'iPhone, on gère les encoches avec safe-area -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EFEAFB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nous" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Nous</title>
    <!-- Thème posé avant le premier affichage (pas de flash blanc en mode sombre). Même logique que src/lib/theme.ts -->
    <script>
      ;(function () {
        var mq = matchMedia('(prefers-color-scheme: dark)')
        function apply() {
          var pref = null
          try { pref = localStorage.getItem('nous.theme') } catch (e) {}
          var dark = pref === 'dark' || (pref !== 'light' && mq.matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.querySelector('meta[name=theme-color]').content = dark ? '#1C1529' : '#EFEAFB'
        }
        apply()
        mq.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
